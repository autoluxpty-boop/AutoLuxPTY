<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AutoLux | Premium Car Accessories</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { background: #000; color: #fff; }
    a { text-decoration: none; color: inherit; }

    header {
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    header h1 {
      letter-spacing: 3px;
      font-size: 24px;
    }

    .hero {
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
    }

    .hero h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 18px;
      opacity: 0.8;
      margin-bottom: 40px;
    }

    .btn {
      padding: 15px 40px;
      border: 1px solid #fff;
      letter-spacing: 2px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #fff;
      color: #000;
    }

    footer {
      border-top: 1px solid #222;
      text-align: center;
      padding: 20px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<header>
  <h1>AUTOLUX</h1>
</header>

<section class="hero">
  <h2>Upgrade Your Drive</h2>
  <p>Premium car accessories designed for comfort and style.</p>
  <a href="shop.html" class="btn">SHOP NOW</a>
  
</section>

<footer>
  © 2006 AutoLux. All rights reserved.
</footer>

</body>
</html>
