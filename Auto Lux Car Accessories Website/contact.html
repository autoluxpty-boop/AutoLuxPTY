<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AutoLux | Contact Us</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { background: #000; color: #fff; }
    a { text-decoration: none; color: inherit; }

    header {
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    header h1 {
      letter-spacing: 3px;
      font-size: 24px;
    }

    nav a {
      margin-left: 20px;
      font-size: 14px;
      opacity: 0.8;
    }

    nav a:hover { opacity: 1; }

    .contact-container {
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      border: 1px solid #222;
      background: rgba(0,0,0,0.7);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 32px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      background: #111;
      border: 1px solid #fff;
      color: #fff;
      font-size: 14px;
    }

    textarea { resize: none; height: 120px; }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #fff;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #fff;
      color: #000;
    }

    .whatsapp-btn {
      margin-top: 15px;
      text-align: center;
    }

    footer {
      border-top: 1px solid #222;
      text-align: center;
      padding: 20px;
      font-size: 12px;
      opacity: 0.6;
      margin-top: 60px;
    }
  </style>
</head>

<body>

<header>
  <h1>AUTOLUX</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="contact-container">
  <h2>Contact AutoLux</h2>

  <form action="mailto:AutoLuxPTY@gmail.com" method="post" enctype="text/plain">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>

    <input type="submit" value="SEND MESSAGE" class="btn">
  </form>

  <div class="whatsapp-btn">
    <a href="https://wa.me/27662361174" class="btn">Chat with us on WhatsApp</a>
  </div>
</div>

<footer>
  © 2026 AutoLux. All rights reserved.
</footer>

</body>
</html>
